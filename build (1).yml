name: Compilar Batalla de Fuerza (.exe)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Generar .exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name BatallaDeFuerza --add-data "assets;assets" main.py

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: BatallaDeFuerza
          path: dist/BatallaDeFuerza.exe

      - name: Publicar en Releases (descarga publica)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: descarga
          name: Batalla de Fuerza (ultima version)
          body: Descarga BatallaDeFuerza.exe y ejecutalo en Windows.
          files: dist/BatallaDeFuerza.exe
